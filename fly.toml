app = 'tradingview-telegram-bot-xdhm5w'
primary_region = 'jnb'

[build]
  builder = "paketobuildpacks/builder-jammy-base"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
